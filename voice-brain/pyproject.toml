[project]
name = "voice-brain"
version = "0.1.0"
description = "Local, voice-first knowledge assistant for your Obsidian vault. Speak -> Whisper -> Gemma -> Markdown. Zero cloud."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "yev" }]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.scripts]
voice-brain = "voice_brain.main:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
